<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XGen — UI skeletons</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0e0f12; color: #d4d8e0; font-family: "Segoe UI", system-ui, sans-serif; }
    .toolbar {
      position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 10;
      display: flex; align-items: center; gap: 14px; padding: 0 14px;
      background: #15171b; border-bottom: 1px solid #2a2d34;
      font-size: 13px;
    }
    .toolbar strong { color: #eef0f4; letter-spacing: 0.04em; }
    .toolbar .group { display: flex; gap: 6px; align-items: center; }
    .toolbar label { color: #a8aebb; font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em; }
    .toolbar button {
      background: #24272e; color: #d4d8e0; border: 1px solid #2a2d34;
      padding: 5px 10px; border-radius: 4px; font: inherit; cursor: pointer;
    }
    .toolbar button[aria-pressed="true"] { background: #9a6a30; color: #f5efe0; border-color: #9a6a30; }
    .toolbar button[aria-pressed="true"][data-app="node"] { background: #1e5a8a; color: #c8e8f8; border-color: #1e5a8a; }
    .toolbar button[aria-pressed="true"][data-app="console"] { background: #0a2a0a; color: #60b050; border-color: #1a4a14; }
    .toolbar .divider { width: 1px; height: 20px; background: #2a2d34; }
    .toolbar label.section { color: #4a5a6a; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .toolbar .spacer { flex: 1; }
    .toolbar .meta { color: #4a5a6a; font-size: 11px; font-family: Consolas, monospace; }
    .toolbar .open-link { color: #3a7ab0; font-size: 11px; text-decoration: none; border-bottom: 1px dotted #3a7ab0; }
    .toolbar .open-link:hover { color: #5a9ad0; }
    .stage { position: fixed; inset: 44px 0 0 0; }
    .stage iframe { width: 100%; height: 100%; border: 0; background: #14171c; display: block; }
    .stage[data-split="true"] { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: #2a2d34; }
  </style>
</head>
<body>

<div class="toolbar" role="toolbar" aria-label="Skeleton viewer">
  <strong>XGen UI</strong>

  <div class="divider"></div>

  <!-- Mockup files — Chat instance visual reference -->
  <label class="section">Mockups</label>
  <div class="group" role="group" aria-label="Mockup screens">
    <button data-src="xgen-mockup-client.html"  data-app="client"  aria-pressed="true">Client</button>
    <button data-src="xgen-mockup-node.html"    data-app="node"   aria-pressed="false">Node</button>
    <button data-src="xgen-mockup-console.html" data-app="console" aria-pressed="false">Console</button>
    <button data-src="xgen-mockup-setup.html"   data-app="setup"   aria-pressed="false">Setup</button>
    <button data-src="xgen-mockup-modules.html" data-app="modules" aria-pressed="false">Modules</button>
    <button data-src="xgen-mockup-layer3.html"  data-app="layer3"  aria-pressed="false">Layer 3</button>
    <button data-src="xgen-mockup-client.html|xgen-mockup-node.html" data-app="split" aria-pressed="false">Split</button>
  </div>

  <div class="divider"></div>

  <!-- Original skeleton files — semantic HTML reference -->
  <label class="section">Skeletons</label>
  <div class="group" role="group" aria-label="Skeleton screens">
    <button data-src="client.html?skin=classic"      data-app="sk-client"  aria-pressed="false">Client</button>
    <button data-src="node.html?skin=classic"        data-app="sk-node"    aria-pressed="false">Node</button>
    <button data-src="console.html?skin=classic"     data-app="sk-console" aria-pressed="false">Console</button>
    <button data-src="setup.html?skin=classic"       data-app="sk-setup"   aria-pressed="false">Setup</button>
    <button data-src="modules.html?skin=classic"     data-app="sk-modules" aria-pressed="false">Modules</button>
    <button data-src="layer3-demo.html"              data-app="sk-layer3"  aria-pressed="false">Layer 3</button>
  </div>

  <div class="spacer"></div>
  <a class="open-link" id="open-link" href="xgen-mockup-client.html" target="_blank">open in new tab ↗</a>
  <span class="meta" id="meta">mockup · client</span>
</div>

<div class="stage" id="stage">
  <iframe id="frame-a" title="App A"></iframe>
</div>

<script>
  var current = { src: 'xgen-mockup-client.html', app: 'client', label: 'mockup · client' };
  var stage = document.getElementById('stage');
  var meta  = document.getElementById('meta');
  var openLink = document.getElementById('open-link');

  function render(src, app, label) {
    current = { src: src, app: app, label: label };
    meta.textContent = label;
    openLink.href = src.split('|')[0];

    document.querySelectorAll('[data-app]').forEach(function(b) {
      b.setAttribute('aria-pressed', String(b.dataset.app === app));
    });

    if (src.indexOf('|') !== -1) {
      var parts = src.split('|');
      stage.dataset.split = 'true';
      stage.innerHTML =
        '<iframe src="' + parts[0] + '" title="Left"></iframe>' +
        '<iframe src="' + parts[1] + '" title="Right"></iframe>';
    } else {
      stage.dataset.split = 'false';
      stage.innerHTML = '<iframe src="' + src + '" title="' + app + '"></iframe>';
    }
  }

  document.querySelectorAll('[data-src]').forEach(function(b) {
    b.addEventListener('click', function() {
      var isSkeleton = b.dataset.app.indexOf('sk-') === 0;
      var label = (isSkeleton ? 'skeleton' : 'mockup') + ' · ' + b.dataset.app.replace('sk-', '');
      render(b.dataset.src, b.dataset.app, label);
    });
  });

  render('xgen-mockup-client.html', 'client', 'mockup · client');
</script>

</body>
</html>
