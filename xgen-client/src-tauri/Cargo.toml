[package]
name = "xgen-client-app"
version = "0.1.0"
edition = "2021"
description = "XGen Client — Tauri application shell (Phase 2 Track 1)"

[[bin]]
name = "xgen-client-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = [] }
tauri-plugin-process = "2"

# async runtime — tokio is already pulled in transitively but we need it explicitly
tokio              = { version = "1", features = ["rt", "time", "macros", "sync"] }
tokio-tungstenite  = { version = "0.21", default-features = false, features = ["connect"] }
futures-util       = "0.3"

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4" }
rand        = "0.8"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

xgen-client = { path = ".." }
xgen-common = { path = "../../xgen-common" }
