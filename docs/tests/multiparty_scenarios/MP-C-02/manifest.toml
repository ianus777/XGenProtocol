# MP-C-02 — invite & join (M9 Round-0 cooperative smoke).
#
# Round-0 runs SINGLE-NODE (both actors on node A): real protocol convergence
# (the M8.5-B INV bootstrap + membership resolution), proving the harness
# machinery end-to-end — spawn -> .aicontrol drive -> cross-actor {{}} +
# happens-after ordering -> membership oracle. The TRUE cross-node form (alice@A,
# bob@B, federated) is gated on a fresh-peer `federation initiate` control
# surface that does not exist yet (the external surfaces only federate KNOWN
# peers; FED_3006). That gap is a flagged Multiparty-tests prerequisite.

scenario = "MP-C-02"
description = "invite & join, single-node Round-0 (real convergence); true cross-node form gated on the fresh-peer federation-initiate surface."

[[nodes]]
label = "a"
port = 8475

[[actors]]
name = "alice"
node = "a"
batch = "alice.jsonl"

[[actors]]
name = "bob"
node = "a"
batch = "bob.jsonl"

# Cross-actor reply exports (publish a reply field under a {{key}}).
[[exports]]
actor = "bob"
command = "b1"
field = "identity_id"
key = "bob_identity_id"

[[exports]]
actor = "alice"
command = "a2"
field = "space_id"
key = "space_id"

[[exports]]
actor = "alice"
command = "a3"
field = "room_id"
key = "room_id"

[[exports]]
actor = "alice"
command = "a4"
field = "event_id"
key = "invite_ready"

# Happens-after ordering data-dependency can't express: Bob's space-join (b2)
# must follow Alice's invite (a4). join's only arg-input is space_id (from a2,
# which precedes a4), so the ordering is declared against the invite's export.
[[waits]]
actor = "bob"
command = "b2"
key = "invite_ready"
