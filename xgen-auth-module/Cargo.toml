[package]
name = "xgen-auth-module"
version = "0.10.3"
edition = "2021"

[[bin]]
name = "xgen-auth-module"
path = "src/main.rs"

[lib]
name = "xgen_auth_module"
path = "src/lib.rs"

[dependencies]
xgen-common = { path = "../xgen-common" }
xgen-core = { path = "../xgen-core" }
ed25519-dalek = "2"
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
