# MP-C-07-LOCAL — DM private space, SINGLE NODE — 2-party message convergence.
#
# The single-node DM end-to-end witness (MP-F1a delivery + MP-F4 membership
# resolution, combined). alice@A `create-dm-space` with bob (3-event causal
# chain: dm_space_create → auto-room → invite); alice posts; bob (also on Node A)
# joins the space + the DM room and posts; both messages converge on Node A. NO
# `[[federation]]` ⇒ no facet-1 (cross-node convergence): under test is whether
# the create-dm chain lands AND the 2-party DM converges on the home Node.
#
# MP-F1a (delivery): pre-F1a, `create-dm-space` sent its 3 events fire-and-forget
# then `goodbye`d; the teardown dropped events 2-3 (auto-room + invite), so the
# DM Room never materialised and bob could not even space-join. F1a awaits each
# event's `EventAccepted` before the next send, so the whole chain lands.
#
# MP-F4 (membership resolution): once delivery is fixed, the invitee's room-join
# was dropped by node-side resolution — the room-agnostic membership state_key
# collapsed bob's space-join + room-join onto one key, and the single-tip
# `get_dag_tips` anchored the room-join to a concurrent leaf, so they became
# concurrent siblings and `derive_resolved` dropped one (bob Space-member-not-
# room → `message.text` step-11 NotARoomMember). A1 room-scopes the membership
# key; the frontier `get_dag_tips` makes the room-join descend from the
# space-join. Both fixes land here. The federated MP-C-07 stays KNOWN-FAIL until
# MP-F1b (facet-1).
#
# Oracle scope (single node): the create-dm chain (dm root + auto-room) lands in
# Node A's cooperative event set, bob space-joins + room-joins, AND both messages
# (alice's a3 + bob's b4) converge in Node A's `.events`. RED before MP-F4 (b4
# step-11-rejected). See the `mp_r1_c5` runner doc-comment.
#
# REQUIRES a `--features harness-control` node build (the Mock-clock dial probes
# the fenced `clock advance 0s` at start, M9.2-D1) — uniform with the rest of R1.

scenario = "MP-C-07-LOCAL"
description = "DM private space single-node — 2-party message convergence (MP-F1a delivery + MP-F4 membership resolution): create-dm chain lands, bob space-joins + room-joins, and both messages (a3 + b4) converge on Node A."

[[nodes]]
label = "a"
port = 8487

[[actors]]
name = "alice"
node = "a"
batch = "alice.jsonl"

[[actors]]
name = "bob"
node = "a"
batch = "bob.jsonl"

[[exports]]
actor = "bob"
command = "b1"
field = "identity_id"
key = "bob_identity_id"

[[exports]]
actor = "alice"
command = "a2"
field = "space_id"
key = "space_id"

[[exports]]
actor = "alice"
command = "a2"
field = "room_id"
key = "dm_room"

[[exports]]
actor = "alice"
command = "a3"
field = "event_id"
key = "alice_sent"

# bob posts only after alice's DM message — by then the full create-dm-space
# chain (root + auto-room + invite) is confirmed-landed on Node A, so bob's
# space-join + room-join + send find the DM and its room.
[[waits]]
actor = "bob"
command = "b2"
key = "alice_sent"
