# xgen-mptest — strategic multiparty test harness (M9). TEST-ONLY: spawns the
# real built `xgen-node.exe`/`xgen-client.exe` as separate processes, drives
# them over their `.aicontrol` JSONL pipes, and observes via `.events`/`state`.
# It does NOT link the binaries — black-box over the real deployment surface.
# Not a shipped artifact; never depended on by a binary. Heavy integration
# entry points are `#[ignore]`/out-of-band; pure-logic helpers are fast-tested.

[package]
name = "xgen-mptest"
version = "0.1.0"
edition = "2021"
publish = false
license = "BUSL-1.1"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "1"

# C4 raw-wire injector (M9-D6, F-F): the injector is a wire-client that speaks
# the real transport to a node's Server and crafts (then corrupts) Events. It
# reuses xgen-core's transport + builders + xgen-common's wire/xgid types to
# construct frames — the node remains a separate process, driven black-box over
# the wire (consistent with M9-D3). `ed25519-dalek` for the forged-key signature
# attack. (Same BSL→GPL linkage as xgen-node/xgen-client onto xgen-core.)
xgen-core = { path = "../xgen-core" }
xgen-common = { path = "../xgen-common" }
ed25519-dalek = "2"
chrono = "0.4"
# Names the `MaybeTlsStream<TcpStream>` in `connect_url`'s `Connection<S>` return
# type (the WireActor holds it). Pinned to xgen-core's version.
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }

[dev-dependencies]
tempfile = "3"
