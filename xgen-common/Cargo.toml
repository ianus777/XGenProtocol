[package]
name = "xgen-common"
version = "0.10.3"
edition = "2021"

[dependencies]
chrono = { version = "0.4" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
# XGID Adoption v1 Commit 1 — base/flavour XGID types live in xgen-common so
# they sit beneath every consumer crate (xgen-core, xgen-node, xgen-client).
# - ed25519-dalek: NodeXgid::from_pubkey / IdentityXgid::from_pubkey constructors
#   and the parse-fallible pubkey() decode methods (XGID Adoption v1 runbook
#   Commit 1 "Principal flavours" section).
# - sha2 + base64: hash-anchored from_canonical_bytes constructors and the
#   base64url-no-pad encoding used by principal-flavour URI strings (matches
#   xgen-core::crypto::hashing::hash_uri and xgen-core::crypto::encoding::encode
#   format byte-for-byte — Retrofit Pass 1 will unify the implementations).
# - thiserror: XgidDecodeError variants for principal-flavour parse failures.
ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.21"
thiserror = "1"
# Storage-Engine / Plugin-Framework milestone (SE-D2) — ModuleKindId/ModuleImplId
# are UUIDv4 newtypes (the module/plugin identity vocabulary). `serde` so the
# descriptor advert (SE-D8) serialises ids as plain UUID strings; `v4` so an
# implementation author can mint a fresh impl GUID (a one-off dev step).
uuid = { version = "1", features = ["v4", "serde"] }

[features]
# M8.6 (Federation stress) — exposes `clock::MockClock` to other crates' test
# builds without compiling it into production. xgen-core + xgen-node enable this
# under their own [dev-dependencies]. Within xgen-common, MockClock is also
# available via cfg(test). M9's harness enables the same feature.
mock-clock = []

[dev-dependencies]
# Phase 9 Commit 2 flake fix (task file §3 Commit 2 Lock Q3 option (i)).
# resolve_log_level_* tests mutate the process-global XGEN_LOG env var; under
# workspace parallelism they race with peers reading the same var. #[serial]
# serialises them within the xgen-common test bucket so the env-var dance is
# observable per-test.
serial_test = "3"
