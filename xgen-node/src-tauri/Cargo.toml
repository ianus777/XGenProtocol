[package]
name = "xgen-node-app"
version = "0.1.0"
edition = "2021"
description = "XGen Node — Tauri application shell (Phase 2 Track 1)"

[[bin]]
name = "xgen-node-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri        = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"

# async runtime
tokio = { version = "1", features = ["rt", "time", "macros", "signal"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
chrono      = { version = "0.4" }
rand        = "0.8"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

xgen-node   = { path = ".." }
xgen-common = { path = "../../xgen-common" }
