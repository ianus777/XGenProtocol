[package]
name = "xgen-core"
version = "0.10.3"
edition = "2021"
license = "GPL-2.0-or-later"

[lib]
name = "xgen_core"
path = "src/lib.rs"

[dependencies]
xgen-common = { path = "../xgen-common" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
# Self-set status (PROTO-STATUS.2) — the `emoji` cap is "exactly one grapheme
# cluster"; correct counting of ZWJ sequences / skin-tone modifiers needs
# Unicode grapheme segmentation, not `chars().count()`. Already compiled in the
# workspace as a transitive dep; this promotes it to a direct dependency.
unicode-segmentation = "1"
# Storage-Engine / Plugin-Framework milestone (SE-D5) — EngineSettings is an
# opaque `toml::Value` passthrough: the host hands a `[storage.<engine>]`
# sub-table to StorageEngine::open untyped, the plugin validates its own schema.
toml = "0.8"
tracing = "0.1"
anyhow = "1"
thiserror = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"
# INV-EXP (C3) — MockClock drives the aged-Space federation-replay repro
# deterministically (no real sleep): the 3044 gate reads the injected
# `self.clock.now_utc()` (D-090), so advancing the mock past `valid_until`
# reproduces the receiver-clock divergence the fix closes. Mirrors xgen-node's
# M8.6 dev-dep pattern.
xgen-common = { path = "../xgen-common", features = ["mock-clock"] }
# Leg A-ter — `start_paused` / `tokio::time::pause` (the paused clock that fires
# the authentication-handshake recv bounds in `connection.rs` without real
# waiting). `test-util` is NOT part of `full`; without this declaration the
# paused-time auth tests compile only via resolver-2 feature unification from
# xgen-node's own `test-util` dev-dep — an undeclared cross-crate coupling that
# breaks `cargo test -p xgen-core`. Declared here so they build standalone too.
# Test builds only. Mirrors xgen-node's dev-dep pattern; do not delete as
# "redundant" — `--workspace` masking the omission is exactly the trap.
tokio = { version = "1", features = ["test-util"] }
