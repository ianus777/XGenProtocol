<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>XGen Node — Core Test UI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{margin:0;padding:20px;background:#0a0a09;overflow:hidden}
    :root{
      --s:#16181c;--s2:#1c1f24;--s3:#22262d;--s4:#2a2f38;--s5:#343b47;
      --t:#ece9e1;--t2:#c8c4bc;--t3:#8a8880;--t4:#585c64;
      --pr:#1e5a8a;--pr-ink:#f1f6f9;
      --rad:6px;--rad2:10px;
    }
    body{
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      font-size:13px;
      color:var(--t2);
    }
    .ui-box{
      min-width:260px;
      max-width:280px;
      padding:16px 18px;
      background:var(--s2);
      border:1px solid var(--s4);
      border-radius:var(--rad2);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      text-align:center;
    }
    p{
      color:var(--t2);
      line-height:1.5;
      font-size:13px;
    }
    button{
      background:var(--pr);
      border:1px solid var(--pr);
      border-radius:5px;
      padding:4px 16px;
      color:var(--pr-ink);
      font-size:12px;
      cursor:pointer;
    }
    /* button:hover{background:#c28840;border-color:#c28840} */
    button:hover{background:#2e7ab0;border-color:#6086B3}
  </style>
</head>
<body>
  <div class="ui-box">
    <p>The XGen Node application core test UI</p>
    <button type="button">Shut Down</button>
  </div>
</body>
</html>
