[package]
name = "xgen-node"
version = "0.10.3"
edition = "2021"
build = "build.rs"

[[bin]]
name = "xgen-node"
path = "src/main.rs"

[lib]
name = "xgen_node_lib"
path = "src/lib.rs"

[build-dependencies]
# tauri-build reads tauri.conf.json at compile time so the desktop module's
# `generate_context!()` macro can resolve. Required by D-062 (Tauri compiled
# into the product binary, runtime dispatch chooses UI initialisation).
tauri-build = { version = "2", features = [] }

[dependencies]
xgen-common = { path = "../xgen-common" }
xgen-core = { path = "../xgen-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
toml = "0.8"
shlex = "1"
# M6 Phase 2 — admin audit trail (§2.6.4). SQLite at <data_dir>/xgen-node_audit.db
# per D-035. `bundled` compiles SQLite from source so no system libsqlite3 is
# required (important on Windows). First SQLite use in the workspace.
rusqlite = { version = "0.31", features = ["bundled"] }
# Tauri desktop shell — D-062.
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-process = "2"
# Storage-Engine milestone (SE-D3, C4) — the reference durable storage engine,
# registered into the EngineTable only when the `store-sqlite` feature is on.
# Optional so the vanilla default backend needs no extra dependency.
xgen-store-sqlite = { path = "../xgen-store-sqlite", optional = true }

[features]
# SE-D3 — compile in + register the SQLite storage engine. Off by default: the
# vanilla in-memory backend (D-080) is always present and needs no feature.
store-sqlite = ["dep:xgen-store-sqlite"]
# M9.2 (M9.2-D1, the fence) — the harness-enablement control surfaces (F2
# `federation add-peer`, F3 `clock advance`/`clock set`). OFF BY DEFAULT: every
# F2/F3 seam is `#[cfg(feature = "harness-control")]`-gated, so a default
# `cargo build` (release or dev) physically cannot contain them. The security
# property is un-buildability in release, not a runtime guard. Forwards
# `xgen-common/mock-clock` so `MockClock` is compiled into the binary for the
# F3 clock seam (D3). F4 (raw-frame injection) is test-crate-only and needs no
# feature — it is NOT covered by this fence.
harness-control = ["xgen-common/mock-clock"]

[target.'cfg(windows)'.dependencies]
# Direct Win32 binding for GetModuleFileNameW — more reliable than current_exe() on Windows
windows-sys = { version = "0.59", features = ["Win32_System_LibraryLoader"] }

[dev-dependencies]
tempfile = "3"
# M8.6 (Federation stress) — the clock-injection seam's MockClock, used by the
# C4 scheduler-churn tests to drive the 15/30/60/120-min reconnect ladder
# without real waiting. Production builds never enable this feature.
xgen-common = { path = "../xgen-common", features = ["mock-clock"] }
# M8.6 C4 — `start_paused` + `tokio::time::advance` (the tokio paused clock that
# fires the connect-timeout without real waiting). `test-util` is not part of
# `full`; unioned in only for test builds.
tokio = { version = "1", features = ["test-util"] }
# Phase 9 Commit 2 flake fix (task file §3 Commit 2 Lock Q3 option (i)).
# Serialises the federation_delta_integration tests so concurrent 127.0.0.1:0
# binds + WS frame ordering inside the same test binary don't race under
# workspace parallelism.
serial_test = "3"
# Phase 9 Commit 3 (task file §3 Commit 3) — `#[traced_test]` installs a
# per-test tracing subscriber so the Phase 9 deployment scenarios can assert
# on the G2 stable `event = "..."` trace fields without scraping log files
# (`logs_contain("federation_push_sent")`, etc.).
tracing-test = "0.2"
