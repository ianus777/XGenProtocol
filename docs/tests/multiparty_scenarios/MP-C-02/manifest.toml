# MP-C-02 — invite & join, true cross-node A↔B (MP-R1 Tranche 1 / C4).
#
# Promoted from the M9 Round-0 single-node smoke to true cross-node now that the
# F2 fresh-peer federation surface exists (M9.2). alice@A creates the Space +
# room and invites bob; bob@B joins (INV pending-invite bootstrap, M8.5-B). The
# runner establishes the A↔B federation via the G-6 bootstrap (MP-R1-D1a);
# membership + cooperative DAG content converge on both nodes. (The asymmetric
# `state.federation_add` bootstrap event is excluded from the convergence oracle
# per MP-R1-D7 — registry-only on A, materialized on B.)
#
# REQUIRES a `--features harness-control` node build (the federation seam verbs
# are fenced, M9.2-D1).

scenario = "MP-C-02"
description = "invite & join, true cross-node A↔B (alice@A invites; bob@B joins; membership + content converge)."

[[nodes]]
label = "a"
port = 8475

[[nodes]]
label = "b"
port = 8476

[[federation]]
from = "a"
to = "b"

[[actors]]
name = "alice"
node = "a"
batch = "alice.jsonl"

[[actors]]
name = "bob"
node = "b"
batch = "bob.jsonl"

# Cross-actor reply exports (publish a reply field under a {{key}}).
[[exports]]
actor = "bob"
command = "b1"
field = "identity_id"
key = "bob_identity_id"

[[exports]]
actor = "alice"
command = "a2"
field = "space_id"
key = "space_id"

[[exports]]
actor = "alice"
command = "a3"
field = "room_id"
key = "room_id"

[[exports]]
actor = "alice"
command = "a4"
field = "event_id"
key = "invite_ready"

# Happens-after ordering data-dependency can't express: Bob's space-join (b2)
# must follow Alice's invite (a4). join's only arg-input is space_id (from a2,
# which precedes a4), so the ordering is declared against the invite's export.
[[waits]]
actor = "bob"
command = "b2"
key = "invite_ready"
