[package]
name = "xgen-client"
version = "0.10.3"
edition = "2021"
build = "build.rs"

[[bin]]
name = "xgen-client"
path = "src/main.rs"

[lib]
name = "xgen_client_lib"
path = "src/lib.rs"

[build-dependencies]
# tauri-build reads tauri.conf.json at compile time so the desktop module's
# `generate_context!()` macro can resolve. Required by D-062.
tauri-build = { version = "2", features = [] }
# M-RP6.1e-C2 — build.rs parses ui/client/package-lock.json for the resolved
# Svelte version (a crude string scan of a lockfile is fragile). Already a
# runtime dependency below.
serde_json = "1"

[dependencies]
xgen-common = { path = "../xgen-common" }
xgen-core = { path = "../xgen-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "chrono"] }
anyhow = "1"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
toml = "0.8"
shlex = "1"
# Tauri desktop shell — D-062.
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
# M-RP6.1e-C3 — open the About website link in the OS browser (not an in-app
# blank webview). The link atomic stays dumb; the shell wires openUrl (F1).
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
serial_test = "3"
